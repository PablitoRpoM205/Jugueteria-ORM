<div class="container form-container">
    <h2>Gestión de login</h2>

    <form (ngSubmit)="onSubmit()" class="form-grid">
        <input type="email" placeholder="Email" [(ngModel)]="nuevo.email" name="email" />
        <input type="password" placeholder="Contraseña" [(ngModel)]="nuevo.password" name="password" />
        <button type="submit">Agregar</button>
    </form>

    <ul class="lista">

    </ul>
</div>
