<div class="toast" *ngIf="mostrarMensaje" [class.success]="mensajeExito" [class.error]="!mensajeExito">
    {{ mensaje }}
</div>

<div class="tabla-container">
    <h2>Gestión de Inventario</h2>

    <div class="nuevo-form">
        <input type="number" placeholder="ID del Usuario" [(ngModel)]="nuevo.usuario_id" name="usuario_id">
        <input type="number" placeholder="ID del Juguete" [(ngModel)]="nuevo.juguete_id" name="juguete_id">
        <input type="number" placeholder="Cantidad" [(ngModel)]="nuevo.cantidad" name="cantidad">
        <button class="btn-crear" (click)="crear()">Agregar Inventario</button>
    </div>

    <div class="grid-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario ID</th>
                    <th>Juguete ID</th>
                    <th>Cantidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngIf="inventario.length === 0">
                    <td colspan="5" style="text-align: center; padding: 2rem; color: #999;">
                        No hay inventario registrado
                    </td>
                </tr>
                <tr *ngFor="let item of paginatedData">
                    <td>{{ item.id }}</td>
                    <td>{{ item.usuario_id }}</td>
                    <td>{{ item.juguete_id }}</td>
                    <td>{{ item.cantidad }}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" title="Editar" (click)="editar(item)">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" *ngIf="inventario.length > 0">
        <button class="pagination-btn" (click)="previousPage()" [disabled]="currentPage === 1">
            ‹
        </button>

        <button *ngFor="let page of pageNumbers" class="pagination-btn" [class.active]="page === currentPage"
            (click)="goToPage(page)">
            {{ page }}
        </button>

        <button class="pagination-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
            ›
        </button>

        <div class="pagination-info">
            Página {{ currentPage }} de {{ totalPages }}
        </div>
    </div>
</div>

<div class="modal-backdrop" *ngIf="editando">
    <div class="modal">
        <h3><i class="fa-solid fa-pen-to-square"></i> Editar Inventario</h3>

        <form (ngSubmit)="actualizar()">
            <label>Usuario ID</label>
            <input [(ngModel)]="editando.usuario_id" name="usuario_id" type="number" required />

            <label>Juguete ID</label>
            <input [(ngModel)]="editando.juguete_id" name="juguete_id" type="number" required />

            <label>Cantidad</label>
            <input [(ngModel)]="editando.cantidad" name="cantidad" type="number" required />

            <div class="modal-actions">
                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>
                <button type="button" class="btn-cancel" (click)="cerrarModal()">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
